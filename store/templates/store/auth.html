{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | GadgetHub</title>
    <link rel="stylesheet" href="{% static 'store/style.css' %}">
</head>
<body>
    <header class="navbar">
        <a href="{% url 'home' %}" class="logo">⚡ GadgetHub</a>
        <nav class="nav-links">
            <a href="{% url 'home' %}">← Back to Store</a>
        </nav>
    </header>
    <main class="container">
        <div class="form-card">
            <h2>{{ title }}</h2>
            <form method="POST" class="sell-form" style="margin-top: 1rem;">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-buy btn-full">{{ title }}</button>
            </form>
            <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
                {% if title == 'Login to GadgetHub' %}
                    New here? <a href="{% url 'signup' %}">Create an account</a>
                {% else %}
                    Already have an account? <a href="{% url 'login' %}">Log in</a>
                {% endif %}
            </p>
        </div>
    </main>
</body>
</html>
